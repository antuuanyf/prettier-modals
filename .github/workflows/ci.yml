name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Build Angular wrapper
        run: npm run build:angular

      - name: Unit tests (core + Angular wrapper)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (real animation)
        run: npm run test:e2e

      - name: Install Angular demo dependencies
        run: npm --prefix demos/angular ci

      - name: Build Angular demo (consumes the built artifacts)
        run: npm run build:demo:angular

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
